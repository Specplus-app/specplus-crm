[functions.admin-impersonate]
verify_jwt = false

[functions.admin-create-user]
verify_jwt = false

[functions.bootstrap-admin]
verify_jwt = false

[functions.send-build-sheet]
verify_jwt = true

[functions.signup-shop]
verify_jwt = false

[functions.send-quote]
verify_jwt = true

[functions.send-schedule-options]
verify_jwt = true

# Called only by the server-side scheduler, which authenticates with the
# NOTIFICATION_DISPATCH_SECRET header (checked in the function). It accepts no
# recipients or content; it only drains the notification queue.
[functions.notification-dispatch]
verify_jwt = false

# Customers open quote and build-sheet links without signing in. The quote or
# share token in the body is the authorization; the database decides which
# photo paths it may see (customer_photo_paths, service_role only).
[functions.customer-photos]
verify_jwt = false
